<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northwind - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .login-card {
            max-width: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .btn-google {
            background-color: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            font-weight: 500;
            padding: 10px 16px;
            transition: all 0.2s ease-in-out;
        }

        .btn-google:hover {
            background-color: #f8f9fa;
            border-color: #c6c9cc;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.15);
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card login-card w-100 p-4 text-center">
        <div class="mb-3 text-primary">
            <i class="bi bi-box-seam-fill fs-1"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Northwind API</h3>
        <p class="text-secondary small mb-4">Sistema de Gestión de Productos</p>

        <div id="mensajeAlerta" class="alert alert-info py-2 small d-none" role="alert"></div>

        <p class="text-muted small mb-4">
            Inicia sesión con tu cuenta de Google para acceder al catálogo completo y realizar operaciones.
        </p>

        <button type="button" id="btnGoogleLogin" class="btn btn-google w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.79l7.97-6.2z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Iniciar sesión con Google
        </button>

        <div class="text-muted small mt-2">
            Autenticación segura vía OAuth 2.0
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const API_BASE_URL = 'https://localhost:7192';

        // Comprobar si ya existe una sesión activa con Google
        async function verificarSesion() {
            try {
                const respuesta = await fetch(`${API_BASE_URL}/auth/GoogleOAuth/response`, {
                    credentials: 'include'
                });

                if (respuesta.ok) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Error al verificar sesión previa:', error);
            }
        }

        // Iniciar redirección de login hacia la API de ASP.NET
        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            const returnUrl = new URL('index.html', window.location.href).href;
            window.location.href = `${API_BASE_URL}/auth/GoogleOAuth/google?returnUrl=${encodeURIComponent(returnUrl)}`;
        });

        verificarSesion();
    </script>
</body>

</html>
