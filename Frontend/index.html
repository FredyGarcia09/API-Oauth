<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northwind - Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.datatables.net/3.1.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .user-badge {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Barra de navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand d-flex align-items-center gap-2">
                <i class="bi bi-box-seam"></i>
                Northwind API
            </span>

            <div class="d-flex align-items-center ms-auto">
                <div id="usuarioInfo" class="user-badge text-light me-2 d-none">
                    <i class="bi bi-person-circle me-1"></i>
                    <span id="usuarioNombre"></span>
                </div>
                <button type="button" id="btnCerrarSesion" class="btn btn-outline-light btn-sm" title="Cerrar sesión">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="container mb-5">
        <!-- Contenedor de notificaciones -->
        <div id="contenedorAlertas"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="mb-0 fw-bold text-dark">Lista de productos</h2>
                <small class="text-secondary">Gestión de inventario con Northwind</small>
            </div>
            <button type="button" class="btn btn-primary" id="btnNuevoProducto">
                <i class="bi bi-plus-lg me-1"></i> Agregar
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-3">
                <table class="table table-striped table-hover align-middle" id="listaProductos" style="width:100%">
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Registro / Edición de Producto -->
    <div class="modal fade" id="modalProducto" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="modalProductoTitulo" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalProductoTitulo">Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="frmProducto" class="needs-validation" novalidate>
                        <input type="hidden" id="ProductId" name="ProductId">

                        <!-- Nombre del Producto -->
                        <div class="mb-3">
                            <label for="ProductName" class="form-label">Nombre del Producto *</label>
                            <input type="text" class="form-control" id="ProductName" name="ProductName" required
                                maxlength="40" minlength="5">
                            <div class="invalid-feedback">Por favor, ingresa el nombre del producto (entre 5 y 40 caracteres).</div>
                            <div class="valid-feedback">Correcto</div>
                        </div>

                        <div class="row">
                            <!-- Proveedor -->
                            <div class="col-md-6 mb-3">
                                <label for="SupplierId" class="form-label">Proveedor</label>
                                <select class="form-select" id="SupplierId" name="SupplierId">
                                    <option value="" selected>Selecciona un proveedor...</option>
                                    <!-- Opciones cargadas dinámicamente -->
                                </select>
                            </div>

                            <!-- Categoría -->
                            <div class="col-md-6 mb-3">
                                <label for="CategoryId" class="form-label">Categoría</label>
                                <select class="form-select" id="CategoryId" name="CategoryId">
                                    <option value="" selected>Selecciona una categoría...</option>
                                    <!-- Opciones cargadas dinámicamente -->
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Cantidad por Unidad -->
                            <div class="col-md-6 mb-3">
                                <label for="QuantityPerUnit" class="form-label">Cantidad por Unidad</label>
                                <input type="text" class="form-control" id="QuantityPerUnit" name="QuantityPerUnit"
                                    placeholder="Ej. 24 botellas de 500ml">
                            </div>

                            <!-- Precio Unitario -->
                            <div class="col-md-6 mb-3">
                                <label for="UnitPrice" class="form-label">Precio Unitario ($)</label>
                                <input type="number" class="form-control" id="UnitPrice" name="UnitPrice" step="0.01"
                                    min="0">
                            </div>
                        </div>

                        <div class="row">
                            <!-- Unidades en Stock -->
                            <div class="col-md-4 mb-3">
                                <label for="UnitsInStock" class="form-label">Unidades en Stock</label>
                                <input type="number" class="form-control" id="UnitsInStock" name="UnitsInStock" min="0">
                            </div>

                            <!-- Unidades en Pedido -->
                            <div class="col-md-4 mb-3">
                                <label for="UnitsOnOrder" class="form-label">Unidades en Pedido</label>
                                <input type="number" class="form-control" id="UnitsOnOrder" name="UnitsOnOrder" min="0">
                            </div>

                            <!-- Nivel de Reorden -->
                            <div class="col-md-4 mb-3">
                                <label for="ReorderLevel" class="form-label">Nivel de Reorden</label>
                                <input type="number" class="form-control" id="ReorderLevel" name="ReorderLevel" min="0">
                            </div>
                        </div>

                        <!-- Descontinuado -->
                        <div class="mb-2 form-check text-start">
                            <input type="checkbox" class="form-check-input" id="Discontinued" name="Discontinued"
                                value="true">
                            <label class="form-check-label" for="Discontinued">Producto Descontinuado</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="submit" form="frmProducto" class="btn btn-primary" id="btnGuardar">Guardar</button>
                    <button type="button" class="btn btn-warning" id="btnLimpiar">Limpiar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Confirmar Eliminación -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-danger" id="modalEliminarTitulo">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Confirmar Eliminación
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="eliminarProductId">
                    <p class="mb-0">¿Estás seguro de que deseas eliminar el producto <strong id="eliminarProductName"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y DataTables -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/3.1.4/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/3.1.4/js/dataTables.bootstrap5.min.js"></script>

    <script>
        const API_BASE_URL = 'https://localhost:7192';

        let tablaProductos = null;
        let modalProductoInstance = null;
        let modalEliminarInstance = null;

        const form = document.querySelector('#frmProducto');
        const modalProductoElement = document.getElementById('modalProducto');
        const modalEliminarElement = document.getElementById('modalEliminar');

        // Mostrar alertas amigables en la interfaz
        function mostrarAlerta(mensaje, tipo = 'success') {
            const contenedor = document.getElementById('contenedorAlertas');
            contenedor.innerHTML = `
                <div class="alert alert-${tipo} alert-dismissible fade show shadow-sm" role="alert">
                    ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            setTimeout(() => {
                const alerta = contenedor.querySelector('.alert');
                if (alerta) {
                    const bsAlert = bootstrap.Alert.getOrCreateInstance(alerta);
                    bsAlert.close();
                }
            }, 5000);
        }

        // Sanitizar texto para usar seguro en atributos HTML
        function escapeHtml(texto) {
            if (!texto) return '';
            return String(texto)
                .replace(/&/g, '&amp;')
                .replace(/'/g, '&#39;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Validar la sesión con el endpoint de autenticación de Google
        async function verificarSesion() {
            try {
                const respuesta = await fetch(`${API_BASE_URL}/auth/GoogleOAuth/response`, {
                    credentials: 'include'
                });

                // Si no hay sesión válida, redirigir al portal de acceso
                if (respuesta.status === 401 || respuesta.status === 403) {
                    window.location.href = 'login.html';
                    return false;
                }

                if (!respuesta.ok) {
                    throw new Error(`HTTP ${respuesta.status}`);
                }

                const usuario = await respuesta.json();
                const usuarioInfo = document.getElementById('usuarioInfo');
                const usuarioNombre = document.getElementById('usuarioNombre');

                usuarioNombre.textContent = usuario.nombre || usuario.email;
                usuarioInfo.classList.remove('d-none');
                return true;
            } catch (error) {
                console.error('Error al verificar la sesión:', error);
                window.location.href = 'login.html';
                return false;
            }
        }

        // Obtener la lista de categorías para el selector
        async function cargarCategorias() {
            try {
                const respuesta = await fetch(`${API_BASE_URL}/api/Categories`, {
                    credentials: 'include'
                });

                if (respuesta.status === 401 || respuesta.status === 403) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!respuesta.ok) {
                    throw new Error(`HTTP ${respuesta.status}`);
                }

                const categorias = await respuesta.json();
                const selectCategoria = document.getElementById('CategoryId');
                selectCategoria.innerHTML = '<option value="" selected>Selecciona una categoría...</option>';

                categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.categoryId;
                    option.textContent = cat.categoryName;
                    selectCategoria.appendChild(option);
                });
            } catch (error) {
                console.error('Error al cargar las categorías:', error);
            }
        }

        // Obtener la lista de proveedores para el selector
        async function cargarProveedores() {
            try {
                const respuesta = await fetch(`${API_BASE_URL}/api/Suppliers`, {
                    credentials: 'include'
                });

                if (respuesta.status === 401 || respuesta.status === 403) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!respuesta.ok) {
                    throw new Error(`HTTP ${respuesta.status}`);
                }

                const proveedores = await respuesta.json();
                const selectProveedor = document.getElementById('SupplierId');
                selectProveedor.innerHTML = '<option value="" selected>Selecciona un proveedor...</option>';

                proveedores.forEach(prov => {
                    const option = document.createElement('option');
                    option.value = prov.supplierId;
                    option.textContent = prov.companyName;
                    selectProveedor.appendChild(option);
                });
            } catch (error) {
                console.error('Error al cargar los proveedores:', error);
            }
        }

        // Obtener y renderizar la lista completa de productos en DataTable
        async function cargarProductos() {
            try {
                const respuesta = await fetch(`${API_BASE_URL}/api/Products`, {
                    credentials: 'include'
                });

                if (respuesta.status === 401 || respuesta.status === 403) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!respuesta.ok) {
                    throw new Error(`HTTP ${respuesta.status}`);
                }

                const data = await respuesta.json();

                if (tablaProductos) {
                    tablaProductos.clear();
                    tablaProductos.rows.add(data);
                    tablaProductos.draw();
                } else {
                    tablaProductos = new DataTable('#listaProductos', {
                        data: data,
                        language: {
                            search: "Buscar:",
                            lengthMenu: "Mostrar _MENU_ productos",
                            info: "Mostrando _START_ a _END_ de _TOTAL_ productos",
                            infoEmpty: "No hay productos disponibles",
                            infoFiltered: "(filtrado de _MAX_ registros totales)",
                            zeroRecords: "No se encontraron productos coincidentes",
                            paginate: {
                                first: "Primero",
                                last: "Último",
                                next: "Siguiente",
                                previous: "Anterior"
                            }
                        },
                        columns: [
                            { title: 'ID', data: 'productId', width: '5%' },
                            { title: 'Producto', data: 'productName' },
                            { title: 'Proveedor', data: 'supplier' },
                            { title: 'Categoría', data: 'category' },
                            {
                                title: 'Precio',
                                data: 'unitPrice',
                                render: function (data) {
                                    return data != null ? `$${parseFloat(data).toFixed(2)}` : '$0.00';
                                }
                            },
                            {
                                title: 'Existencia',
                                data: 'unitsInStock',
                                render: function (data) {
                                    return data ?? 0;
                                }
                            },
                            {
                                title: 'Estado',
                                data: 'discontinued',
                                render: function (data) {
                                    return data
                                        ? '<span class="badge bg-secondary">Descontinuado</span>'
                                        : '<span class="badge bg-success">Activo</span>';
                                }
                            },
                            {
                                title: 'Acciones',
                                data: null,
                                orderable: false,
                                render: function (data, type, row) {
                                    return `
                                        <div class="btn-group btn-group-sm" role="group">
                                            <button type="button" class="btn btn-outline-primary" onclick="abrirModalEditar(${row.productId})" title="Editar">
                                                <i class="bi bi-pencil-square"></i>
                                            </button>
                                            <button type="button" class="btn btn-outline-danger" onclick="abrirModalEliminar(${row.productId}, '${escapeHtml(row.productName)}')" title="Eliminar">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    `;
                                }
                            }
                        ]
                    });
                }
            } catch (error) {
                console.error('Error al cargar productos:', error);
                mostrarAlerta('No se pudieron cargar los productos.', 'danger');
            }
        }

        // Preparar y abrir el modal para un nuevo producto
        function abrirModalNuevo() {
            form.reset();
            form.classList.remove('was-validated');
            document.getElementById('ProductId').value = '';
            document.getElementById('SupplierId').value = '';
            document.getElementById('CategoryId').value = '';
            document.getElementById('Discontinued').checked = false;
            document.getElementById('modalProductoTitulo').textContent = 'Registrar Producto';
            modalProductoInstance.show();
        }

        // Obtener datos del producto por ID y abrir el modal en modo edición
        async function abrirModalEditar(id) {
            try {
                const respuesta = await fetch(`${API_BASE_URL}/api/Products/${id}`, {
                    credentials: 'include'
                });

                if (respuesta.status === 401 || respuesta.status === 403) {
                    window.location.href = 'login.html';
                    return;
                }

                if (!respuesta.ok) {
                    mostrarAlerta('No se encontró el producto a editar.', 'danger');
                    return;
                }

                const producto = await respuesta.json();

                form.reset();
                form.classList.remove('was-validated');

                document.getElementById('ProductId').value = producto.productId;
                document.getElementById('ProductName').value = producto.productName ?? '';
                document.getElementById('SupplierId').value = producto.supplierId ?? '';
                document.getElementById('CategoryId').value = producto.categoryId ?? '';
                document.getElementById('QuantityPerUnit').value = producto.quantityPerUnit ?? '';
                document.getElementById('UnitPrice').value = producto.unitPrice ?? '';
                document.getElementById('UnitsInStock').value = producto.unitsInStock ?? '';
                document.getElementById('UnitsOnOrder').value = producto.unitsOnOrder ?? '';
                document.getElementById('ReorderLevel').value = producto.reorderLevel ?? '';
                document.getElementById('Discontinued').checked = Boolean(producto.discontinued);

                document.getElementById('modalProductoTitulo').textContent = 'Editar Producto';
                modalProductoInstance.show();
            } catch (error) {
                console.error('Error al obtener el producto:', error);
                mostrarAlerta('Error al cargar la información del producto.', 'danger');
            }
        }

        // Manejar el guardado (POST para nuevo, PUT para actualizar)
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!form.checkValidity()) {
                event.stopPropagation();
                form.classList.add('was-validated');
                return;
            }

            const idValor = document.getElementById('ProductId').value;
            const esEdicion = Boolean(idValor);

            // Estructura de datos respetando tipos de la API
            const datosProducto = {
                productName: document.getElementById('ProductName').value.trim(),
                supplierId: document.getElementById('SupplierId').value ? parseInt(document.getElementById('SupplierId').value, 10) : null,
                categoryId: document.getElementById('CategoryId').value ? parseInt(document.getElementById('CategoryId').value, 10) : null,
                quantityPerUnit: document.getElementById('QuantityPerUnit').value.trim() || null,
                unitPrice: document.getElementById('UnitPrice').value !== '' ? parseFloat(document.getElementById('UnitPrice').value) : null,
                unitsInStock: document.getElementById('UnitsInStock').value !== '' ? parseInt(document.getElementById('UnitsInStock').value, 10) : null,
                unitsOnOrder: document.getElementById('UnitsOnOrder').value !== '' ? parseInt(document.getElementById('UnitsOnOrder').value, 10) : null,
                reorderLevel: document.getElementById('ReorderLevel').value !== '' ? parseInt(document.getElementById('ReorderLevel').value, 10) : null,
                discontinued: document.getElementById('Discontinued').checked
            };

            const url = esEdicion
                ? `${API_BASE_URL}/api/Products/${idValor}`
                : `${API_BASE_URL}/api/Products`;

            if (esEdicion) {
                datosProducto.productId = parseInt(idValor, 10);
            }

            try {
                const respuesta = await fetch(url, {
                    method: esEdicion ? 'PUT' : 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(datosProducto)
                });

                if (respuesta.status === 401 || respuesta.status === 403) {
                    window.location.href = 'login.html';
                    return;
                }

                if (respuesta.ok) {
                    modalProductoInstance.hide();
                    mostrarAlerta(esEdicion ? 'Producto actualizado exitosamente.' : 'Producto registrado exitosamente.', 'success');
                    cargarProductos();
                } else {
                    mostrarAlerta('Ocurrió un error al procesar la solicitud.', 'danger');
                }
            } catch (error) {
                console.error('Error al guardar el producto:', error);
                mostrarAlerta('Error de conexión con el servidor.', 'danger');
            }
        });

        // Limpiar formulario y restablecer validaciones
        document.getElementById('btnLimpiar').addEventListener('click', () => {
            const idActual = document.getElementById('ProductId').value;
            form.reset();
            form.classList.remove('was-validated');
            document.getElementById('ProductId').value = idActual;
            document.getElementById('SupplierId').value = '';
            document.getElementById('CategoryId').value = '';
            document.getElementById('Discontinued').checked = false;
        });

        // Abrir modal de confirmación de eliminación
        function abrirModalEliminar(id, nombre) {
            document.getElementById('eliminarProductId').value = id;
            document.getElementById('eliminarProductName').textContent = nombre;
            modalEliminarInstance.show();
        }

        // Ejecutar eliminación llamando a DELETE api/Products/{id}
        document.getElementById('btnConfirmarEliminar').addEventListener('click', async () => {
            const id = document.getElementById('eliminarProductId').value;
            if (!id) return;

            try {
                const respuesta = await fetch(`${API_BASE_URL}/api/Products/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                modalEliminarInstance.hide();

                if (respuesta.status === 401 || respuesta.status === 403) {
                    window.location.href = 'login.html';
                    return;
                }

                if (respuesta.ok) {
                    mostrarAlerta('Producto eliminado correctamente.', 'success');
                    cargarProductos();
                } else if (respuesta.status === 400) {
                    // Manejo del mensaje de pedidos asociados de la API
                    const errorData = await respuesta.json();
                    mostrarAlerta(errorData.message || 'No se puede eliminar el producto.', 'warning');
                } else {
                    mostrarAlerta('Error al eliminar el producto.', 'danger');
                }
            } catch (error) {
                console.error('Error al eliminar producto:', error);
                mostrarAlerta('Error de conexión al eliminar el producto.', 'danger');
            }
        });

        // Cerrar sesión en la API y regresar al login
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            const returnUrl = new URL('login.html', window.location.href).href;
            window.location.href = `${API_BASE_URL}/auth/GoogleOAuth/logout?returnUrl=${encodeURIComponent(returnUrl)}`;
        });

        // Inicializar vistas y eventos
        document.addEventListener('DOMContentLoaded', async () => {
            modalProductoInstance = new bootstrap.Modal(modalProductoElement);
            modalEliminarInstance = new bootstrap.Modal(modalEliminarElement);

            document.getElementById('btnNuevoProducto').addEventListener('click', abrirModalNuevo);

            // Validar sesión antes de cargar información
            const sesionValida = await verificarSesion();
            if (sesionValida) {
                cargarProveedores();
                cargarCategorias();
                cargarProductos();
            }
        });
    </script>
</body>

</html>
