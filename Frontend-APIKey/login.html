<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northwind - Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
        }

        .login-card {
            max-width: 440px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }

        .nav-pills .nav-link {
            color: #495057;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            padding: 8px 16px;
        }

        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            color: #ffffff;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center p-3">

    <div class="card login-card w-100 p-4">
        <!-- Encabezado -->
        <div class="text-center mb-4">
            <div class="text-primary mb-2">
                <i class="bi bi-box-seam-fill fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Northwind</h3>
            <p class="text-secondary small mb-0">Gestión de Catálogo y Pedidos</p>
        </div>

        <!-- Alerta de retroalimentación -->
        <div id="mensajeAlerta" class="alert alert-info py-2 small d-none" role="alert"></div>

        <!-- Pestañas de Acceso (Iniciar Sesión / Registrarse) -->
        <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-3" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-login-btn" data-bs-toggle="pill" data-bs-target="#tab-login"
                    type="button" role="tab" aria-controls="tab-login" aria-selected="true">
                    Iniciar Sesión
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-registro-btn" data-bs-toggle="pill" data-bs-target="#tab-registro"
                    type="button" role="tab" aria-controls="tab-registro" aria-selected="false">
                    Registrarse
                </button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            <!-- 1. INICIAR SESIÓN -->
            <div class="tab-pane fade show active" id="tab-login" role="tabpanel" aria-labelledby="tab-login-btn">
                <form id="frmLogin" novalidate>
                    <div class="mb-3">
                        <label for="loginUsername" class="form-label small fw-semibold">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="loginUsername" placeholder="Nombre de usuario" required autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label small fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña" required autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" id="btnLoginSubmit" class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        <span>Iniciar Sesión</span>
                    </button>
                </form>
            </div>

            <!-- 2. REGISTRO -->
            <div class="tab-pane fade" id="tab-registro" role="tabpanel" aria-labelledby="tab-registro-btn">
                <form id="frmRegistro" novalidate>
                    <div class="mb-3">
                        <label for="regUsername" class="form-label small fw-semibold">Usuario *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="regUsername" maxlength="50" placeholder="Nombre de usuario" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label small fw-semibold">Correo Electrónico *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="regEmail" maxlength="150" placeholder="correo@ejemplo.com" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label small fw-semibold">Contraseña *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="regPassword" minlength="8" placeholder="Mínimo 8 caracteres" required>
                        </div>
                        <div class="form-text small text-muted">
                            Debe contener al menos 8 caracteres.
                        </div>
                    </div>
                    <button type="submit" id="btnRegistroSubmit" class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                        <span id="regSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        <span>Crear Cuenta</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Pie de página -->
        <div class="text-center text-muted small mt-4 pt-3 border-top">
            <span>&copy; Northwind Traders</span>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
