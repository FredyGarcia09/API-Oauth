<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northwind - Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.datatables.net/3.1.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .user-badge {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Barra de navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand d-flex align-items-center gap-2">
                <i class="bi bi-box-seam"></i>
                Northwind API
            </span>

            <div class="d-flex align-items-center ms-auto">
                <div id="usuarioInfo" class="user-badge text-light me-2 d-none">
                    <i class="bi bi-person-circle me-1"></i>
                    <span id="usuarioNombre"></span>
                </div>
                <button type="button" id="btnCerrarSesion" class="btn btn-outline-light btn-sm" title="Cerrar sesión">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="container mb-5">
        <!-- Contenedor de notificaciones -->
        <div id="contenedorAlertas"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="mb-0 fw-bold text-dark">Lista de productos</h2>
                <small class="text-secondary">
                    <span id="saludoBienvenida" class="d-none">¡Hola, <strong id="saludoNombre" class="text-dark"></strong>! &bull; </span>Gestión de inventario con Northwind
                </small>
            </div>
            <button type="button" class="btn btn-primary" id="btnNuevoProducto">
                <i class="bi bi-plus-lg me-1"></i> Agregar
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-3">
                <table class="table table-striped table-hover align-middle" id="listaProductos" style="width:100%">
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Registro / Edición de Producto -->
    <div class="modal fade" id="modalProducto" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="modalProductoTitulo" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalProductoTitulo">Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="frmProducto" class="needs-validation" novalidate>
                        <input type="hidden" id="ProductId" name="ProductId">

                        <!-- Nombre del Producto -->
                        <div class="mb-3">
                            <label for="ProductName" class="form-label">Nombre del Producto *</label>
                            <input type="text" class="form-control" id="ProductName" name="ProductName" required
                                maxlength="40" minlength="5">
                            <div class="invalid-feedback">Por favor, ingresa el nombre del producto (entre 5 y 40 caracteres).</div>
                            <div class="valid-feedback">Correcto</div>
                        </div>

                        <div class="row">
                            <!-- Proveedor -->
                            <div class="col-md-6 mb-3">
                                <label for="SupplierId" class="form-label">Proveedor</label>
                                <select class="form-select" id="SupplierId" name="SupplierId">
                                    <option value="" selected>Selecciona un proveedor...</option>
                                    <!-- Opciones cargadas dinámicamente -->
                                </select>
                            </div>

                            <!-- Categoría -->
                            <div class="col-md-6 mb-3">
                                <label for="CategoryId" class="form-label">Categoría</label>
                                <select class="form-select" id="CategoryId" name="CategoryId">
                                    <option value="" selected>Selecciona una categoría...</option>
                                    <!-- Opciones cargadas dinámicamente -->
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Cantidad por Unidad -->
                            <div class="col-md-6 mb-3">
                                <label for="QuantityPerUnit" class="form-label">Cantidad por Unidad</label>
                                <input type="text" class="form-control" id="QuantityPerUnit" name="QuantityPerUnit"
                                    placeholder="Ej. 24 botellas de 500ml">
                            </div>

                            <!-- Precio Unitario -->
                            <div class="col-md-6 mb-3">
                                <label for="UnitPrice" class="form-label">Precio Unitario ($)</label>
                                <input type="number" class="form-control" id="UnitPrice" name="UnitPrice" step="0.01"
                                    min="0">
                            </div>
                        </div>

                        <div class="row">
                            <!-- Unidades en Stock -->
                            <div class="col-md-4 mb-3">
                                <label for="UnitsInStock" class="form-label">Unidades en Stock</label>
                                <input type="number" class="form-control" id="UnitsInStock" name="UnitsInStock" min="0">
                            </div>

                            <!-- Unidades en Pedido -->
                            <div class="col-md-4 mb-3">
                                <label for="UnitsOnOrder" class="form-label">Unidades en Pedido</label>
                                <input type="number" class="form-control" id="UnitsOnOrder" name="UnitsOnOrder" min="0">
                            </div>

                            <!-- Nivel de Reorden -->
                            <div class="col-md-4 mb-3">
                                <label for="ReorderLevel" class="form-label">Nivel de Reorden</label>
                                <input type="number" class="form-control" id="ReorderLevel" name="ReorderLevel" min="0">
                            </div>
                        </div>

                        <!-- Descontinuado -->
                        <div class="mb-2 form-check text-start">
                            <input type="checkbox" class="form-check-input" id="Discontinued" name="Discontinued"
                                value="true">
                            <label class="form-check-label" for="Discontinued">Producto Descontinuado</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="submit" form="frmProducto" class="btn btn-primary" id="btnGuardar">Guardar</button>
                    <button type="button" class="btn btn-warning" id="btnLimpiar">Limpiar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Confirmar Eliminación -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-danger" id="modalEliminarTitulo">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Confirmar Eliminación
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="eliminarProductId">
                    <p class="mb-0">¿Estás seguro de que deseas eliminar el producto <strong id="eliminarProductName"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y DataTables -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/3.1.4/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/3.1.4/js/dataTables.bootstrap5.min.js"></script>

    <!-- Módulos de lógica de la aplicación -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/productos.js"></script>
</body>

</html>
